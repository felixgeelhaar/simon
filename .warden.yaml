# warden — local git gate for simon (Go). Sole hook manager; the persistent
# artifact is this file. pre-commit stays fast (format + vet); pre-push runs the
# checks that matter before code leaves the machine (race tests, build). warden's
# native hooks live in .git/hooks and auto-fetch the binary if missing, so a
# fresh clone is gated with no toolchain beyond the Go SDK the repo already needs.
#
# Note: golangci-lint is intentionally omitted — this repo ships no .golangci.yml,
# so there is no agreed lint config to enforce locally. Add a golangcilint command
# and pre_push step once .golangci.yml lands.
extends: ''
agent: auto
hooks:
  pre_commit: true
  pre_push: true
commands:
  # gofmt -l lists mis-formatted files; warden treats non-empty output as a
  # failure, so this CHECKS formatting (run `gofmt -w .` to fix).
  gofmt: gofmt -l .
  govet: go vet ./...
  gotest: go test -race ./...
  gobuild: go build ./...
steps:
  pre_commit:
    - gofmt
    - govet
  pre_push:
    - rebase
    - gofmt
    - govet
    - gotest
    - gobuild
risk:
  diff_lines_high: 400
  files_touched_high: 15
pr:
  enabled: false
rules: []
